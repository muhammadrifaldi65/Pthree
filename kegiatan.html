<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PTHREE — Kegiatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    :root{
      --paper:#F2E8D5; --card:#FBF5E7; --ink:#2A2016; --muted:#6E5F4C;
      --forest:#2E4638; --forest-dark:#1E3226;
      --brass:#A9813C; --brass-light:#C9A360; --burgundy:#7A2A2A;
      --border:1px solid rgba(42,32,22,.16); --border-soft:1px solid rgba(42,32,22,.09);
      --shadow:0 14px 30px rgba(42,32,22,.16); --shadow-sm:0 6px 14px rgba(42,32,22,.14);
      --radius:10px; --container:1200px; --ease:cubic-bezier(.22,.61,.36,1); --topbar-h:78px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:var(--topbar-h)}
    body{
      margin:0;font-family:"Literata",Georgia,"Times New Roman",serif;color:var(--ink);
      background-color:var(--paper);
      background-image:
        radial-gradient(rgba(42,32,22,.05) 1px, transparent 1px),
        radial-gradient(rgba(42,32,22,.03) 1px, transparent 1px);
      background-size:3px 3px, 9px 9px; background-position:0 0, 3px 5px;
      max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;
      -webkit-overflow-scrolling:touch;
    }
    a{color:var(--forest-dark);text-decoration:none} a:hover{text-decoration:underline}
    img,iframe{max-width:100%}
    .container{max-width:var(--container);margin:auto;padding:0 1rem}
    h1,h2,h3{font-family:"Fraunces",Georgia,serif;color:var(--forest-dark);margin:0}

    /* ===== Topbar ===== */
    .topbar{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:3px double var(--brass)}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;min-height:var(--topbar-h)}
    .brand-wrap{display:inline-flex;align-items:center;gap:.7rem;text-decoration:none}
    .brand-logo{width:34px;height:34px;object-fit:cover;border-radius:50%;border:2px solid var(--brass);box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--brass-light)}
    .brand-block{display:flex;flex-direction:column;line-height:1.05}
    .brand{font-family:"Fraunces",serif;font-weight:700;font-size:1.2rem;color:var(--forest-dark);letter-spacing:.2px}
    .brand-tag{display:none;font-family:"Work Sans",sans-serif;font-size:.66rem;color:var(--muted);letter-spacing:.05em}
    @media (min-width:640px){.brand-tag{display:block}}

    .hamb{width:42px;height:42px;border-radius:8px;border:1px solid var(--brass);display:grid;place-content:center;background:var(--card);cursor:pointer}
    .hamb i{font-size:18px;color:var(--forest-dark)}

    .nav-inline{display:none;align-items:center;gap:.15rem}
    .nav-inline .nav-link{display:inline-block;padding:10px 14px;border-radius:6px;font-family:"Work Sans",sans-serif;font-weight:600;font-size:.93rem;color:var(--ink);position:relative;text-decoration:none}
    .nav-inline .nav-link:hover{background:rgba(46,70,56,.08);text-decoration:none;color:var(--forest-dark)}
    .nav-inline .nav-link.active{color:var(--forest-dark)}
    .nav-inline .nav-link.active::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:3px;background:var(--brass);border-radius:2px}
    @media (min-width:900px){.nav-inline{display:flex}.hamb{display:none}}

    header .mobile-menu{position:fixed;inset:0;z-index:999;transform:none!important;opacity:1!important;background:transparent!important;pointer-events:none;display:block;visibility:hidden}
    header .mobile-menu.open{pointer-events:auto;visibility:visible;z-index:2000!important}
    .mobile-menu__backdrop{position:absolute;inset:0;background:rgba(20,16,10,.55);opacity:0;transition:opacity .25s var(--ease)}
    .mobile-menu.open .mobile-menu__backdrop{opacity:1}
    .mobile-menu__panel{
      position:absolute;top:0;right:0;height:100%;width:min(88vw,380px);
      background:var(--forest-dark);color:var(--paper);box-shadow:-16px 0 32px rgba(20,16,10,.35);
      border-left:3px solid var(--brass);transform:translateX(100%);transition:transform .35s var(--ease);
      display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)
    }
    .mobile-menu.open .mobile-menu__panel{transform:translateX(0)}
    .mobile-menu__bar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid rgba(242,232,213,.18);font-family:"Fraunces",serif;font-weight:700}
    .mobile-menu__close{width:38px;height:38px;border-radius:8px;background:rgba(242,232,213,.08);border:1px solid rgba(242,232,213,.25);display:grid;place-content:center;cursor:pointer;color:var(--paper)}
    .mobile-menu__links{display:flex;flex-direction:column;gap:2px;padding:18px 14px 24px;overflow:auto}
    .mobile-menu__links a{display:block;padding:14px 12px;color:var(--paper);font-family:"Work Sans",sans-serif;font-weight:600;font-size:1.02rem;border-bottom:1px dashed rgba(242,232,213,.22);text-decoration:none}
    .mobile-menu__links a:hover{background:rgba(242,232,213,.06)}
    .mobile-menu__links a.active{border-left:3px solid var(--brass);background:rgba(242,232,213,.06);padding-left:9px}
    @media (min-width:900px){.mobile-menu{display:none!important}}
    @media (prefers-reduced-motion:reduce){.mobile-menu__backdrop,.mobile-menu__panel{transition:none}}
    .no-scroll{position:fixed;inset:0;overflow:hidden}

    /* ===== Konten ===== */
    main{padding:1rem 0}
    h1{margin:1.2rem 0 .2rem;font-size:clamp(1.8rem,2vw + 1rem,2.6rem)}
    .muted{color:var(--muted)}
    .sep{position:relative;height:2px;margin:.9rem 0 1.8rem;background:linear-gradient(90deg,transparent,var(--brass) 15%,var(--brass) 85%,transparent)}
    .sep::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--paper);border:2px solid var(--brass);transform:translate(-50%,-50%) rotate(45deg)}

    /* Etalase / display case */
    .carousel{position:relative;overflow:hidden;border-radius:6px;box-shadow:var(--shadow);margin:1rem 0 2.2rem;background:var(--card);border:6px solid var(--card)}
    .carousel::before,.carousel::after{content:"";position:absolute;width:22px;height:22px;z-index:5;pointer-events:none}
    .carousel::before{top:8px;left:8px;border-top:3px solid var(--brass);border-left:3px solid var(--brass)}
    .carousel::after{bottom:8px;right:8px;border-bottom:3px solid var(--brass);border-right:3px solid var(--brass)}
    .track{display:flex;touch-action:pan-y;will-change:transform}
    .slide{min-width:100%;user-select:none}
    .slide img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
    .dots{position:absolute;left:0;right:0;bottom:.6rem;display:flex;gap:.35rem;justify-content:center;pointer-events:none;z-index:6}
    .dot{width:8px;height:8px;border-radius:10px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(42,32,22,.3)}
    .dot.active{background:var(--brass-light)}

    /* Galeri corkboard */
    .masonry{column-count:1;column-gap:1rem}
    .masonry img{width:100%;display:block;margin:0 0 1.1rem;border:6px solid var(--card);border-radius:2px;box-shadow:0 10px 22px rgba(42,32,22,.28);background:#fff}
    .masonry img:nth-child(odd){transform:rotate(-1deg)}
    .masonry img:nth-child(even){transform:rotate(1deg)}
    .masonry img:hover{transform:rotate(0);transition:transform .25s var(--ease)}
    @media (min-width:640px){.masonry{column-count:2}}
    @media (min-width:1024px){.masonry{column-count:3}}

    footer{text-align:center;padding:2rem 0 3rem;color:var(--muted);border-top:3px double var(--brass);margin-top:1.5rem;font-family:"Work Sans",sans-serif;font-size:.9rem}

    .reveal{opacity:0;transform:translateY(14px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
    .reveal.visible{opacity:1;transform:none}
    body.page-enter{animation:pageIn .35s var(--ease) both}
    body.page-exit{animation:pageOut .22s var(--ease) both}
    @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes pageOut{to{opacity:0;transform:translateY(6px)}}

    @media (max-width:899.98px){
      .topbar{position:fixed!important;top:0;left:0;right:0;z-index:1000}
      body{padding-top:var(--topbar-h)}
    }

    #backToTop{
      position:fixed;bottom:24px;right:24px;width:46px;height:52px;border:none;cursor:pointer;
      background:var(--forest);color:var(--paper);font-size:17px;box-shadow:var(--shadow-sm);
      opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s,transform .3s;z-index:1000;
      clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);border-radius:6px 6px 0 0
    }
    #backToTop:hover{background:var(--forest-dark);transform:translateY(-3px)}
    #backToTop.show{opacity:1;visibility:visible}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand-wrap" aria-label="Beranda PTHREE">
        <img src="https://i.imgur.com/u2k2fsE.jpg" alt="Logo PTHREE" class="brand-logo">
        <span class="brand-block"><span class="brand">PTHREE</span><span class="brand-tag">Perkumpulan Pembaca</span></span>
      </a>

      <nav class="nav-inline" aria-label="Navigasi utama">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link active" href="kegiatan.html" aria-current="page">Kegiatan</a>
        <a class="nav-link" href="tentang.html">Tentang</a>
        <a class="nav-link" href="kontak.html">Kontak</a>
      </nav>

      <button class="hamb" id="hamb" aria-label="Buka menu" aria-controls="menu" aria-expanded="false">
        <i class="fa fa-bars"></i>
      </button>
    </div>

    <nav class="mobile-menu" id="menu" aria-label="Navigasi seluler" aria-hidden="true">
      <div class="mobile-menu__backdrop" data-close></div>
      <div class="mobile-menu__panel" role="dialog" aria-modal="true" aria-labelledby="mobileMenuTitle">
        <div class="mobile-menu__bar">
          <strong id="mobileMenuTitle">PTHREE</strong>
          <button class="mobile-menu__close" id="closeMenu" aria-label="Tutup menu" data-close>
            <i class="fa fa-close" aria-hidden="true"></i>
          </button>
        </div>
        <div class="mobile-menu__links">
          <a href="index.html">Dashboard</a>
          <a class="active" href="kegiatan.html" aria-current="page">Kegiatan</a>
          <a href="tentang.html">Tentang</a>
          <a href="kontak.html">Kontak</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1 class="reveal">Kegiatan &amp; Galeri</h1>
    <p class="muted reveal">Dokumentasi visual kegiatan PTHREE.</p>
    <div class="sep"></div>

    <!-- Etalase / slider -->
    <div class="carousel reveal" aria-label="Galeri pilihan">
      <div class="track" id="track">
        <div class="slide"><img src="https://ik.imagekit.io/3fgrgeqi6z/WhatsApp%20Image%202025-02-06%20at%2013.58.08_e13edae4.jpg?updatedAt=1761223838127" alt="Galeri 1" loading="lazy" decoding="async"></div>
        <div class="slide"><img src="https://imgur.com/eIFXKLW.jpg" alt="Galeri 2" loading="lazy" decoding="async"></div>
        <div class="slide"><img src="https://imgur.com/8ev83tB.jpg" alt="Galeri 3" loading="lazy" decoding="async"></div>
        <div class="slide"><img src="https://i.imgur.com/rjVU3La.jpeg" alt="Galeri 3" loading="lazy" decoding="async"></div>
        <div class="slide"><img src="https://i.imgur.com/MkZWWpE.jpeg" alt="Galeri 3" loading="lazy" decoding="async"></div>
        <div class="slide"><img src="https://ik.imagekit.io/3fgrgeqi6z/WhatsApp%20Image%202025-07-25%20at%2014.31.03_cd7a0283.jpg?updatedAt=1761223492385" alt="Galeri 3" loading="lazy" decoding="async"></div>
      </div>

    <!-- Papan galeri -->
    <div class="masonry reveal">
      <img src="https://i.imgur.com/avLGlgl.jpeg.jpg" alt="Kegiatan 1" loading="lazy" decoding="async">
      <img src="https://i.imgur.com/hQWCNhy.jpeg.jpg" alt="Kegiatan 2" loading="lazy" decoding="async">

      <img src="https://i.imgur.com/dqLtu9J.jpeg.jpg" alt="Kegiatan 8" loading="lazy" decoding="async">
      <img src="https://ik.imagekit.io/3fgrgeqi6z/WhatsApp%20Image%202025-02-07%20at%2009.58.12_494a4948.jpg?updatedAt=1761224280622" alt="Kegiatan 8" loading="lazy" decoding="async">
      <img src="https://i.imgur.com/MkZWWpE.jpeg" alt="Kegiatan 8" loading="lazy" decoding="async">
      <img src="https://ik.imagekit.io/3fgrgeqi6z/WhatsApp%20Image%202025-07-25%20at%2014.31.03_cd7a0283.jpg?updatedAt=1761223492385" alt="Kegiatan 8" loading="lazy" decoding="async">
      <img src="https://ik.imagekit.io/3fgrgeqi6z/WhatsApp%20Image%202024-11-26%20at%2016.50.57_e0c09027.jpg?updatedAt=1761224200756" alt="Kegiatan 8" loading="lazy" decoding="async">
    </div>

    <footer class="reveal">
      <p>© PTHREE 2025 — Perkumpulan Para Pembaca</p>
    </footer>
  </main>
  <button id="backToTop" aria-label="Kembali ke atas">
    <i class="fa fa-arrow-up"></i>
  </button>
  <script>
function bindMenu(){
  const hamb = document.getElementById('hamb');
  const menu = document.getElementById('menu');
  if (!hamb || !menu) return;

  const panel = menu.querySelector('.mobile-menu__panel') || menu;
  const backdrop = menu.querySelector('.mobile-menu__backdrop');
  let lastFocus = null;
  let lastScrollY = 0;

  const focusableSel = 'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function openMenu(){
    menu.classList.add('open');
    menu.setAttribute('aria-hidden','false');
    hamb.setAttribute('aria-expanded','true');
    lastFocus = document.activeElement;
    lastScrollY = window.scrollY || 0;
    document.body.classList.add('no-scroll');
    document.body.style.top = -lastScrollY + 'px';
    const first = panel.querySelector(focusableSel);
    if (first) first.focus({preventScroll:true});
    document.addEventListener('keydown', onKeydown);
  }

  function closeMenu(){
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden','true');
    hamb.setAttribute('aria-expanded','false');
    document.body.classList.remove('no-scroll');
    document.body.style.top = '';
    window.scrollTo(0, lastScrollY);
    document.removeEventListener('keydown', onKeydown);
    if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  }

  function onKeydown(e){ if (e.key === 'Escape') closeMenu(); }

  hamb.addEventListener('click', openMenu);
  menu.addEventListener('click', (e)=>{
    if (e.target.closest('[data-close]')) { closeMenu(); return; }
    const link = e.target.closest('a[href]');
    if (link) closeMenu();
  });
  if (backdrop) backdrop.addEventListener('click', closeMenu);
}

function initReveals(){
  const els = document.querySelectorAll('.reveal, .reveal-stagger');
  if (!els.length) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(ent=>{ if(ent.isIntersecting){ ent.target.classList.add('visible'); io.unobserve(ent.target); }});
  }, { threshold:.18, rootMargin:"0px 0px -10% 0px" });
  els.forEach(el=>io.observe(el));
}

function initSliderIfExists(){
  const track = document.getElementById('track');
  if (!track) return;

  const slides = Array.from(track.children);
  const dotsWrap = document.getElementById('dots');

  let idx = 0;
  let startX = 0, startY = 0;
  let baseX = 0;
  let dragging = false;
  let axis = null;
  let raf = null, pendingX = 0;
  let auto = null;
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

  const viewport = track.parentElement;
  const W = ()=> viewport.clientWidth;

  const setX = (px)=>{
    pendingX = px;
    if (raf) return;
    raf = requestAnimationFrame(()=>{ track.style.transform = `translate3d(${pendingX}px,0,0)`; raf = null; });
  };

  function go(i, trans=true){
    idx = (i + slides.length) % slides.length;
    track.style.transition = trans ? 'transform .45s cubic-bezier(.22,.61,.36,1)' : 'none';
    setX(-idx * W());
    paint();
  }

  function paint(){
    if (!dotsWrap) return;
    dotsWrap.innerHTML = '';
    slides.forEach((_,i)=>{
      const d = document.createElement('span');
      d.className = 'dot' + (i===idx ? ' active' : '');
      dotsWrap.appendChild(d);
    });
  }

  function playAuto(){ if(reduce) return; stopAuto(); auto = setInterval(()=>go(idx+1), 5000); }
  function stopAuto(){ if(auto){ clearInterval(auto); auto = null; } }

  function clampWithRubber(x, min, max){
    if (x > max) return max + (x - max) * 0.35;
    if (x < min) return min + (x - min) * 0.35;
    return x;
  }

  const SLOP = 6;

  function onDown(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; axis = null;
    startX = e.clientX; startY = e.clientY;
    baseX  = -idx * W();
    track.style.transition = 'none';
    stopAuto();
    try{ track.setPointerCapture(e.pointerId); }catch{}
  }

  function onMove(e){
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!axis){
      if (Math.abs(dx) < SLOP && Math.abs(dy) < SLOP) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axis === 'y'){
      dragging = false;
      try{ track.releasePointerCapture(e.pointerId); }catch{}
      return;
    }
    e.preventDefault();
    const maxX = 0;
    const minX = -((slides.length - 1) * W());
    const next = clampWithRubber(baseX + dx, minX, maxX);
    setX(next);
  }

  function onUp(e){
    if (!dragging) return;
    dragging = false;
    try{ track.releasePointerCapture(e.pointerId); }catch{}
    const dx = e.clientX - startX;
    const th = W() * 0.12;
    if (dx < -th)      go(idx+1);
    else if (dx > th)  go(idx-1);
    else               go(idx);
    playAuto();
  }

  track.addEventListener('pointerdown', onDown, {passive:false});
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  track.addEventListener('mouseenter', stopAuto);
  track.addEventListener('mouseleave', playAuto);
  document.addEventListener('visibilitychange', ()=>{ document.hidden ? stopAuto() : playAuto(); });

  window.addEventListener('resize', ()=>go(idx,false));

  go(0,false);
  playAuto();
}

function initPageTransitions(){
  document.body.classList.add('page-enter');
  const isInternal = (a)=>{ try{ return a.origin===location.origin && !a.hasAttribute('download') && !a.target; }catch{return false;} };
  document.addEventListener('click',(e)=>{
    const a=e.target.closest('a'); if(!a) return;
    const href=a.getAttribute('href')||''; if(href.startsWith('#')) return; if(!isInternal(a)) return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button===1) return;
    e.preventDefault(); document.body.classList.add('page-exit'); setTimeout(()=>{ window.location.href=a.href; },220);
  });
}

bindMenu();
initReveals();
initSliderIfExists();
initPageTransitions();

const backToTop = document.getElementById('backToTop');
if(backToTop){
  window.addEventListener('scroll', ()=>{
    if(window.scrollY > 400) backToTop.classList.add('show');
    else backToTop.classList.remove('show');
  });
  backToTop.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
  </script>
